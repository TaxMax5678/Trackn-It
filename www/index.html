<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Attendance Tracker</title>
<style>
:root{
  --bg:#0b0d12; --surface:#141821; --surface2:#1c212d; --line:#262c3a;
  --text:#eef1f7; --muted:#8b93a7; --accent:#7c8cff;
  --green:#34d399; --yellow:#fbbf24; --red:#f87171;
  --nav-h:68px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;}
body{min-height:100vh;display:flex;justify-content:center}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select{font:inherit;color:var(--text)}
#app{width:100%;max-width:480px;min-height:100vh;position:relative}
main{padding:20px 16px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom))}
h1{font-size:26px;margin:0;letter-spacing:-.5px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);margin:26px 0 12px;font-weight:600}
.sub{color:var(--muted);font-size:14px;margin-top:4px}

/* nav */
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);background:rgba(20,24,33,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;z-index:20}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);padding:8px 0;transition:color .2s}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.active{color:var(--text)}
nav button.active:not(.home) svg{stroke:var(--accent)}
nav button.home .orb{width:52px;height:52px;border-radius:18px;display:grid;place-items:center;background:var(--surface2);border:1px solid var(--line);margin-top:-22px;transition:.2s}
nav button.home.active .orb{background:linear-gradient(135deg,#7c8cff,#a78bfa);border-color:transparent;box-shadow:0 8px 24px rgba(124,140,255,.4)}
nav button.home.active svg{stroke:#fff}

/* home */
.hero{background:linear-gradient(135deg,#1b2140,#241b40);border:1px solid #2d3358;border-radius:22px;padding:18px;margin-top:18px;display:flex;align-items:center;gap:16px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),#2a3050 0);display:grid;place-items:center;flex:none}
.ring span{width:50px;height:50px;border-radius:50%;background:#1b2040;display:grid;place-items:center;font-weight:700;font-size:15px}
.hero b{font-size:17px}
.hero p{margin:3px 0 0;color:#aab1d6;font-size:13px}

.card{--c:var(--accent);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 14px 14px 18px;margin-bottom:12px;position:relative;overflow:hidden;transition:border-color .25s, background .25s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.card.present{border-color:rgba(52,211,153,.5);background:linear-gradient(90deg,rgba(52,211,153,.10),var(--surface) 60%)}
.card.missed{border-color:rgba(248,113,113,.5);background:linear-gradient(90deg,rgba(248,113,113,.10),var(--surface) 60%)}
.card.live{border-color:rgba(251,191,36,.6);background:linear-gradient(90deg,rgba(251,191,36,.10),var(--surface) 60%)}
.row{display:flex;align-items:center;gap:12px}
.emoji{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 22%,transparent);flex:none}
.grow{flex:1;min-width:0}
.name{font-weight:650;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{color:var(--muted);font-size:13px;margin-top:2px}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.present{background:rgba(52,211,153,.16);color:var(--green)}
.badge.missed{background:rgba(248,113,113,.16);color:var(--red)}
.badge.live{background:rgba(251,191,36,.16);color:var(--yellow)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{padding:11px;border-radius:13px;font-weight:650;font-size:14px;background:var(--surface2);border:1px solid var(--line);transition:.15s}
.btn:active{transform:scale(.97)}
.btn.p.on{background:var(--green);color:#052e1f;border-color:transparent}
.btn.b.on{background:var(--red);color:#3b0a0a;border-color:transparent}
.btn.p:not(.on){color:var(--green)}
.btn.b:not(.on){color:var(--red)}
.card.live .btn:not(.on){border-color:rgba(251,191,36,.35)}

.empty{text-align:center;color:var(--muted);padding:36px 20px;background:var(--surface);border:1px dashed var(--line);border-radius:20px;font-size:14px;line-height:1.5}
.empty .big{font-size:38px;margin-bottom:8px}
.primary{background:linear-gradient(135deg,#7c8cff,#a78bfa);color:#fff;padding:12px 18px;border-radius:14px;font-weight:650;margin-top:14px;display:inline-block}

/* schedule */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{--c:var(--accent);display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:14px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,transparent);font-size:14px;font-weight:600}
.chip.time{background:var(--surface);border-color:var(--line)}
.chip.add{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.days button{padding:10px 0;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--muted);position:relative}
.days button.active{background:var(--accent);color:#fff;border-color:transparent}
.days button.today:not(.active)::after{content:"";position:absolute;bottom:4px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.slot{cursor:pointer}
.slot .chev{color:var(--muted);font-size:18px}
.slot.vacant{--c:var(--line);background:transparent;border-style:dashed}
.slot.vacant .tbox{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;color:var(--muted);background:var(--surface2);flex:none}
.slot.vacant .name{color:var(--muted);font-weight:600}
.tlabel{font-weight:650;font-size:15px}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.iconbtn{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tt{display:grid;grid-template-columns:58px 1fr;gap:10px;margin-bottom:8px}
.tt .t{font-size:11px;color:var(--muted);line-height:1.4;padding-top:11px;text-align:right}
.tt .t b{display:block;font-size:12px;color:var(--text);font-weight:650}
.tt .card{margin:0;padding:9px 12px 9px 16px;border-radius:16px}
.tt .emoji{width:34px;height:34px;font-size:18px;border-radius:10px}
.tt .name{font-size:15px}
.tt .slot.vacant .tbox{width:34px;height:34px;font-size:18px;border-radius:10px}
.brk{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:2px 0 10px}
.brk::after{content:"";flex:1;height:1px;background:var(--line)}
.brk.tt-brk{padding-left:68px}
.trow{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:14px;background:var(--surface2);border:1px solid var(--line);margin-bottom:8px;text-align:left}
.trow .k{font-size:18px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--surface2);padding:4px;border-radius:14px}
.seg button{padding:10px;border-radius:11px;font-weight:650;font-size:14px;color:var(--muted)}
.seg button.sel{background:var(--accent);color:#fff}

.mnav{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}
.mnav b{font-size:17px}
.mnav button{width:40px;height:40px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:650;padding:6px 0}
.cd{aspect-ratio:1;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600;color:var(--text);position:relative}
.cd.blank{visibility:hidden}
.cd.today{outline:2px solid var(--accent);outline-offset:1px}
.cd.hol{background:rgba(248,113,113,.22);border-color:rgba(248,113,113,.6);color:#fca5a5}
.cd.abs{background:rgba(127,29,29,.75);border-color:#b91c1c;color:#fecaca}
.cd.full{background:rgba(52,211,153,.22);border-color:rgba(52,211,153,.6);color:#6ee7b7}
.cd.part{background:rgba(251,191,36,.22);border-color:rgba(251,191,36,.6);color:#fcd34d}
.cd.goal{background:rgba(250,204,21,.28);border-color:#facc15;color:#fde047;box-shadow:0 0 14px rgba(250,204,21,.45)}
.warn{color:#fca5a5;background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.4;margin-top:10px}
.hbtn{font-size:12px;font-weight:650;text-transform:none;letter-spacing:0;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:6px 12px}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:18px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sw{width:44px;height:26px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}
.nchips{display:flex;gap:6px;flex-wrap:wrap}
.nchips button{padding:10px 14px;border-radius:11px;background:var(--surface2);border:1px solid var(--line);font-size:13px;font-weight:650;color:var(--muted)}
.nchips button.sel{background:var(--red);color:#3b0a0a;border-color:transparent}
.drow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface2);margin-bottom:8px;border-left:4px solid var(--c,var(--accent))}
.drow .e{font-size:20px}
.mini{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);font-weight:700;background:var(--surface)}
.mini.p{color:var(--green)}.mini.b{color:var(--red)}
.mini.p.on{background:var(--green);color:#052e1f;border-color:transparent}
.mini.b.on{background:var(--red);color:#3b0a0a;border-color:transparent}

.ring{background:conic-gradient(var(--rc,var(--green)) calc(var(--p)*1%),#2a3050 0)}
.ring span{font-size:13px}
button.hero{width:100%;text-align:left;color:inherit}
.hgrow{flex:1;min-width:0}
.hero .edit{color:#aab1d6;font-size:16px}
.stack{position:relative;padding-bottom:30px}
.peek{--c:var(--accent);position:absolute;left:0;right:0;top:0;bottom:30px;border-radius:24px;background:var(--surface);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));transform-origin:top center}
.peek.p1{transform:translateY(14px) scale(.94);opacity:.85}
.peek.p2{transform:translateY(28px) scale(.88);opacity:.55}
.topcard{--c:var(--accent);position:relative;z-index:2;cursor:pointer;padding:20px;border-radius:24px;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 26%,var(--surface)),var(--surface) 75%);border:1.5px solid color-mix(in srgb,var(--c) 55%,transparent);transition:transform .15s}
.topcard:active{transform:scale(.98)}
.topcard.live{border-color:rgba(251,191,36,.7);box-shadow:0 0 0 3px rgba(251,191,36,.12)}
.tc-top{display:flex;justify-content:space-between;align-items:center}
.tc-emoji{font-size:60px;margin:16px 0 8px}
.tc-name{font-size:24px;font-weight:700}
.tc-time{color:var(--muted);margin-top:6px;font-size:15px}
.tc-hint{margin-top:16px;font-size:12px;color:var(--muted)}
.mrow{--c:var(--accent);display:flex;align-items:center;gap:12px;width:100%;padding:11px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c);margin-bottom:8px;text-align:left}
.mrow .e{font-size:20px}
.focus{position:fixed;inset:0;z-index:70;background:rgba(5,7,12,.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;animation:fade .2s;touch-action:none;overflow:hidden}
.fcard{--c:var(--accent);width:min(84vw,340px);padding:26px 22px;border-radius:28px;text-align:center;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 28%,var(--surface)),var(--surface) 70%);border:2px solid color-mix(in srgb,var(--c) 60%,transparent);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;box-shadow:0 24px 60px rgba(0,0,0,.5);position:relative;z-index:2}
.fcard.go-r{border-color:var(--green)}
.fcard.go-l{border-color:var(--red)}
.fl,.fr{position:absolute;top:50%;transform:translateY(-50%);font-weight:800;font-size:14px;text-align:center;padding:10px 12px;border-radius:14px;opacity:0;pointer-events:none;line-height:1.5}
.fl{left:10px;color:var(--red);background:rgba(248,113,113,.15)}
.fr{right:10px;color:var(--green);background:rgba(52,211,153,.15)}
.fup{position:absolute;top:calc(36px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);opacity:.5;font-size:14px;color:var(--muted);font-weight:650;pointer-events:none}
.fbtns{display:flex;gap:30px;margin-top:30px;z-index:2}
.rb{width:58px;height:58px;border-radius:50%;font-size:24px;font-weight:700;border:2px solid}
.rb.m{color:var(--red);border-color:rgba(248,113,113,.5);background:rgba(248,113,113,.1)}
.rb.a{color:var(--green);border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.1)}
.fcap{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom));color:var(--muted);font-size:12px;text-align:center;padding:0 20px}
.bigpct{font-size:48px;font-weight:800;text-align:center;margin:10px 0 6px;letter-spacing:-1px}
.range{width:100%;accent-color:var(--accent);height:32px}

.bubble{background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden}
.bhead{display:flex;justify-content:space-between;align-items:center;padding:16px 16px 12px}
.bhead b{font-size:16px}
.bhead span{color:var(--muted);font-size:13px}
.bbody{padding:0 10px 10px}
.brow{--c:var(--accent);display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:14px;background:var(--surface2);border-left:4px solid var(--c);margin-bottom:6px;text-align:left}
.brow:last-child{margin-bottom:0}
.brow .e{font-size:18px}
.brow .bn{flex:1;min-width:0;font-weight:650;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .bt{color:var(--muted);font-size:12px;white-space:nowrap}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:12px}
.phead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.k{font-size:12px;color:var(--muted);font-weight:600}
.bigp{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.tg{font-size:24px;font-weight:700}
.bar{position:relative;height:10px;border-radius:99px;background:var(--surface2)}
.bar i{display:block;height:100%;border-radius:inherit;background:var(--c,var(--accent))}
.bar u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.7;text-decoration:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px}
.tile .n{font-size:28px;font-weight:800;margin-bottom:2px}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin-bottom:10px}
.srow .sh{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.srow .e{font-size:20px}
.srow .sn{flex:1;min-width:0;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach{text-align:center;padding:12px 6px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--muted)}
.ach .i{font-size:26px;display:block;margin-bottom:4px;filter:grayscale(1);opacity:.4}
.ach.on{color:var(--text);border-color:rgba(124,140,255,.5);background:rgba(124,140,255,.1)}
.ach.on .i{filter:none;opacity:1}

.wdbars{display:flex;gap:8px}
.wdc{flex:1;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.wdb{height:80px;border-radius:8px;background:var(--surface2);display:flex;align-items:flex-end;overflow:hidden;margin-bottom:6px}
.wdb i{display:block;width:100%}

.cd.out{opacity:.3}
.cd.todo::after{content:"";position:absolute;bottom:5px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--muted)}
.drange{display:flex;gap:8px}
.drange .btn{width:46px;flex:none;padding:0}
.steppers{margin-top:12px;border-top:1px solid var(--line);padding-top:6px}
.stp{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:14px}
.stp div{display:flex;align-items:center;gap:12px}
.stp b{min-width:30px;text-align:center}
.stp button{width:34px;height:34px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:18px;font-weight:700}

.ovbtn{display:block;width:100%;text-align:left;color:inherit}
.chev2{color:var(--muted);font-size:10px;margin-left:4px}
.best{display:block;width:100%;text-align:left;color:inherit;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 22%,var(--surface)),var(--surface) 70%);border:1.5px solid color-mix(in srgb,var(--c) 50%,transparent);border-radius:20px;padding:16px;margin-bottom:12px}
.best .sh{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.best .e{font-size:28px}
.best .sn{flex:1;min-width:0;font-weight:700;font-size:18px}
.best b{font-size:20px}

.num{width:64px;text-align:center;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:16px;font-weight:700;outline:none;color-scheme:dark;-moz-appearance:textfield}
.num:focus{border-color:var(--accent)}
.num::-webkit-outer-spin-button,.num::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.num.wide{width:100%}
.subin{display:block;font-size:12px;color:var(--muted);font-weight:600}
.subin .num{margin-top:6px}

.tt.jn{margin-bottom:0}
.tt.jn .card{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
.tt.jp .card{border-top-left-radius:0;border-top-right-radius:0;border-top-color:transparent}
.tt.jp .emoji,.tt.jp .name{visibility:hidden}
.tt.jp .t{visibility:hidden}
.drow.jn{margin-bottom:0;border-bottom-left-radius:0;border-bottom-right-radius:0}
.drow.jp{border-top-left-radius:0;border-top-right-radius:0}
.drow.jp .e,.drow.jp .name,.drow.jp .time{visibility:hidden}

.card.merged{display:flex;align-items:center}
.card.merged .row{width:100%}

.xtag{font-size:10px;font-weight:700;color:var(--accent);background:rgba(124,140,255,.15);padding:2px 7px;border-radius:99px;margin-left:6px;vertical-align:middle}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{overscroll-behavior:contain;width:100%;max-width:480px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));border:1px solid var(--line);border-bottom:0;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.grab{height:30px;margin:-10px -18px 0;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
.grab::before{content:"";width:40px;height:4px;background:var(--line);border-radius:4px}
.sheet h3{margin:0 0 4px;font-size:20px}
.sheet .hint{color:var(--muted);font-size:13px;margin-bottom:14px}
label.l{display:block;font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px;margin:16px 0 8px}
.in{width:100%;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;outline:none;font-size:16px;color-scheme:dark}
.in:focus{border-color:var(--accent)}
.emojis,.swatches{display:flex;flex-wrap:wrap;gap:8px}
.emojis button{width:42px;height:42px;border-radius:12px;background:var(--surface2);border:1px solid transparent;font-size:21px}
.emojis button.sel{border-color:var(--accent);background:rgba(124,140,255,.18)}
.swatches button{width:36px;height:36px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent}
.swatches button.sel{border-color:var(--surface);outline-color:var(--text)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.picks{display:flex;flex-direction:column;gap:8px}
.pick{--c:var(--accent);display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface2);border:1px solid var(--line);text-align:left}
.pick .emoji{width:40px;height:40px;font-size:21px;border-radius:12px}
.pick.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--surface2))}
.pick .tick{margin-left:auto;color:var(--c);font-weight:700}
.foot{display:flex;gap:10px;margin-top:22px}
.foot .btn{flex:1;padding:14px}
.foot .save{background:linear-gradient(135deg,#7c8cff,#a78bfa);color:#fff;border:0}
.foot .del{color:var(--red);flex:.6}
.foot .del.arm{background:var(--red);color:#3b0a0a}
.note{color:var(--muted);font-size:13px;margin-top:8px}

.ph{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:60vh;color:var(--muted);gap:8px}
.ph .big{font-size:54px}
.ph b{color:var(--text);font-size:20px}

#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--surface2);border:1px solid var(--line);padding:10px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(40px);opacity:0}}
</style>
</head>
<body>
<div id="app">
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<div id="sheet-root"></div>
<div id="toast"></div>

<script>
(() => {
const KEY = 'attendance_tracker_v1';
const COLORS = ['#7c8cff','#a78bfa','#f472b6','#f87171','#fb923c','#fbbf24','#34d399','#22d3ee'];
const EMOJIS = ['📘','📐','🧪','💻','🌍','🎨','🎵','⚽','📊','🧬','⚙️','📝','🔬','🏛️','🗣️','📡','🧠','💼','🧮','📚'];
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_ORDER = [1,2,3,4,5,6,0];
const rid = () => Math.random().toString(36).slice(2,10);

/* state: subjects[], periods[{id,start,end}], slots[{id,day,periodId,subjectId}], records{date:{slotId:status}} */
function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  if (!s || !s.subjects) s = { subjects: [], periods: [], slots: [], records: {} };
  if (!s.periods){ // migrate older format (slots carried their own times)
    s.periods = [];
    s.slots = (s.slots || []).map(sl => {
      if (!sl.start) return sl;
      let p = s.periods.find(p => p.start === sl.start && p.end === sl.end);
      if (!p){ p = { id: rid(), start: sl.start, end: sl.end }; s.periods.push(p); }
      return { id: sl.id, day: sl.day, subjectId: sl.subjectId, periodId: p.id };
    });
  }
  s.settings = s.settings || { sunOff: true, satOff: [] };
  Object.values(s.records || {}).forEach(r => Object.keys(r).forEach(k => { if (r[k] === 'bunked') r[k] = 'missed'; }));
  s.settings.target = s.settings.target || 75;
  ['adjP','adjM','missAdj'].forEach(k => { s.settings[k] = +s.settings[k] || 0; });
  s.settings.subjAdj = s.settings.subjAdj || {};
  s.backfill = s.backfill || {};
  s.extras = s.extras || {};
  s.settings.semStart = s.settings.semStart || '';
  s.settings.semEnd = s.settings.semEnd || '';
  s.settings.sunOff = true;
  s.holidays = s.holidays || {};
  return s;
}
let state = load();
let ui = { subCfg: false, subMode: 'total', ovOpen: false, wiN: 3, tab: 'home', day: new Date().getDay(), cal: { y: new Date().getFullYear(), m: new Date().getMonth() } };

function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
const uid = rid;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const fmt = t => { let [h,m] = t.split(':').map(Number); const ap = h>=12?'PM':'AM'; h = h%12||12; return `${h}:${pad(m)} ${ap}`; };
const subj = id => state.subjects.find(s => s.id === id);
const period = id => state.periods.find(p => p.id === id);
const sortedPeriods = () => [...state.periods].sort((a,b) => toMin(a.start) - toMin(b.start));
const slotAt = (day, periodId) => state.slots.find(s => s.day === day && s.periodId === periodId && subj(s.subjectId));
const slotsFor = day => {
  const out = [];
  sortedPeriods().forEach(p => {
    if (p.kind === 'break') return;
    const sl = slotAt(day, p.id); if (!sl) return;
    if (out.length && joinPrev(day, p)){ const l = out[out.length - 1]; l.ids.push(sl.id); l.end = p.end; return; }
    out.push({ ...sl, ids: [sl.id], start: p.start, end: p.end });
  });
  return out;
};
const blocksOn = d => {
  const ex = (state.extras[dateKey(d)] || []).filter(e => subj(e.subjectId))
    .map(e => ({ id: e.id, ids: [e.id], subjectId: e.subjectId, start: e.start || '', end: e.end || '', extra: true }));
  return slotsFor(d.getDay()).concat(ex).sort((a, b) => (a.start ? toMin(a.start) : 1e9) - (b.start ? toMin(b.start) : 1e9));
};
const rng = b => b.start ? `${fmt(b.start)} – ${fmt(b.end)}` : 'Extra class';
const blockVal = (recs, b) => b.ids.map(i => recs[i]).find(Boolean);
function joinPrev(day, p){
  const ps = sortedPeriods(), i = ps.findIndex(x => x.id === p.id);
  if (i < 1 || p.kind === 'break' || ps[i-1].kind === 'break') return false;
  const a = slotAt(day, ps[i-1].id), b = slotAt(day, p.id);
  return !!(a && b && a.subjectId === b.subjectId);
}
function joinNext(day, p){
  const ps = sortedPeriods(), i = ps.findIndex(x => x.id === p.id);
  return i >= 0 && i < ps.length - 1 && joinPrev(day, ps[i+1]);
}
function chainPeriods(day, p){
  const ps = sortedPeriods(); let i = ps.findIndex(x => x.id === p.id); const out = [ps[i]];
  while (i < ps.length - 1 && joinPrev(day, ps[i+1])){ i++; out.push(ps[i]); }
  return out;
}
function chainEnd(day, p){
  const ps = sortedPeriods();
  let i = ps.findIndex(x => x.id === p.id);
  while (i >= 0 && i < ps.length - 1 && joinPrev(day, ps[i+1])) i++;
  return ps[i].end;
}
function dropSlots(pred){
  const ids = state.slots.filter(pred).map(s => s.id);
  state.slots = state.slots.filter(s => !ids.includes(s.id));
  Object.values(state.records).forEach(r => ids.forEach(i => delete r[i]));
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ---------- nav ---------- */
const ICONS = {
  schedule:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18M8 15h3"/></svg>',
  calendar:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/><circle cx="12" cy="15" r="1.5"/></svg>',
  home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>',
  stats:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  friends:'<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14.5c2.2.7 3.5 2.7 3.5 5.5"/></svg>'
};
const TABS = [['schedule','Schedule'],['calendar','Calendar'],['home','Home'],['stats','Stats'],['friends','Friends']];
function renderNav(){
  document.getElementById('nav').innerHTML = TABS.map(([k,l]) =>
    `<button data-tab="${k}" class="${k==='home'?'home ':''}${ui.tab===k?'active':''}">
      ${k==='home' ? `<span class="orb">${ICONS[k]}</span>` : ICONS[k]}<span>${l}</span></button>`).join('');
}
document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; render(); window.scrollTo(0,0);
});

/* ---------- views ---------- */
function render(){ renderNav(); const v = document.getElementById('view');
  v.innerHTML = ui.tab==='home' ? homeView() : ui.tab==='schedule' ? scheduleView() : ui.tab==='calendar' ? calendarView() : ui.tab==='stats' ? statsView() : placeholder(ui.tab);
}

/* ---------- calendar ---------- */
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const ORD = ['1st','2nd','3rd','4th','5th'];
function defaultHoliday(d){
  const wd = d.getDay();
  if (wd === 0) return !!state.settings.sunOff;
  if (wd === 6) return state.settings.satOff.includes(Math.ceil(d.getDate() / 7));
  return false;
}
function inSem(d){ const k = dateKey(d), st = state.settings; return (!st.semStart || k >= st.semStart) && (!st.semEnd || k <= st.semEnd); }
function isHoliday(d){ const o = state.holidays[dateKey(d)]; return o === undefined ? defaultHoliday(d) : o; }
function dayStatus(d){
  const list = blocksOn(d), recs = state.records[dateKey(d)] || {};
  if (!list.length) return '';
  const vals = list.map(b => blockVal(recs, b));
  const marked = vals.filter(Boolean);
  if (!marked.length) return '';
  return marked.every(v => v === 'present') ? 'full' : 'part';
}

function goalReached(){ const o = overall(); return o.t > 0 && o.p / o.t >= (state.settings.target || 75) / 100 - 1e-9; }
function targetCheck(target){
  const end = state.settings.semEnd;
  if (!end) return { known: false };
  const o = overall(), tk = dateKey();
  let R = 0;
  for (let i = 0, d = new Date(); i < 800; i++, d.setDate(d.getDate() + 1)){
    const key = dateKey(d); if (key > end) break;
    if (isHoliday(d) || !inSem(d)) continue;
    const recs = state.records[key] || {};
    for (const b of blocksOn(d)){ if (key === tk && blockVal(recs, b)) continue; R++; }
  }
  const cur = o.t ? o.p / o.t * 100 : 0, best = o.t + R ? (o.p + R) / (o.t + R) * 100 : 0;
  return { known: true, R, best, ok: (o.t > 0 && cur >= target - 1e-9) || best >= target - 1e-9 };
}
function targetWarn(target){
  const c = targetCheck(target);
  if (!c.known || c.ok) return '';
  return c.R > 0
    ? `⚠️ ${target}% can't be reached this semester. Even if you attend all ${c.R} remaining class${c.R === 1 ? '' : 'es'}, you'll only get to ${r1(c.best)}%.`
    : `⚠️ No classes left before your semester end date. You'll finish at ${r1(c.best)}%.`;
}
function goalDate(){
  const target = state.settings.target || 75, tf = target / 100, o = overall();
  if (!o.t) return null;
  if (o.p / o.t >= tf - 1e-9) return dateKey();
  if (tf >= 1) return null;
  let P = o.p, T = o.t;
  const tk = dateKey();
  for (let i = 0, d = new Date(); i < 800; i++, d.setDate(d.getDate() + 1)){
    const key = dateKey(d);
    if (state.settings.semEnd && key > state.settings.semEnd) return null;
    if (isHoliday(d) || !inSem(d)) continue;
    const recs = state.records[key] || {};
    for (const b of blocksOn(d)){
      if (key === tk && blockVal(recs, b)) continue;
      P++; T++;
      if (P / T >= tf - 1e-9) return key;
    }
  }
  return null;
}

function calendarView(){
  const { y, m } = ui.cal, todayKey = dateKey(), goal0 = goalDate(), goal = goal0 && (goal0 !== todayKey || goalReached()) ? goal0 : null;
  const days = new Date(y, m + 1, 0).getDate(), offset = (new Date(y, m, 1).getDay() + 6) % 7;
  let html = `<div class="head"><div><h1>Calendar</h1><div class="sub">Tap a date for details</div></div>
    <button class="iconbtn" data-cal-settings aria-label="Holiday settings"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></div>
    <div class="mnav"><button data-cal-nav="-1">‹</button><b>${MONTHS[m]} ${y}</b><button data-cal-nav="1">›</button></div>
    <div class="cal">${['M','T','W','T','F','S','S'].map(x => `<div class="wd">${x}</div>`).join('')}`;
  for (let i = 0; i < offset; i++) html += `<div class="cd blank"></div>`;
  for (let n = 1; n <= days; n++){
    const d = new Date(y, m, n), key = dateKey(d);
    const out = !inSem(d), hol = isHoliday(d), recs = state.records[key] || {};
    const blks = blocksOn(d), vals = blks.map(b => blockVal(recs, b));
    const mk = vals.filter(Boolean), allMissed = mk.length > 0 && mk.every(v => v === 'missed');
    const allBlank = blks.length > 0 && key < todayKey && vals.every(v => !v);
    const noClass = state.slots.length > 0 && blks.length === 0;
    const cls = out ? 'out' : hol || allBlank || noClass ? 'hol' : allMissed ? 'abs' : dayStatus(d);
    const todo = !out && cls !== 'hol' && key === todayKey && vals.some(v => !v);
    html += `<button class="cd ${cls} ${todo ? 'todo' : ''} ${key === todayKey ? 'today' : ''} ${key === goal && cls !== 'out' ? 'goal' : ''}" data-cal-day="${key}">${n}</button>`;
  }
  html += `</div><div class="legend"><span><i style="background:var(--red)"></i>Holiday / no classes</span><span><i style="background:#991b1b"></i>Missed all day</span><span><i style="background:var(--green)"></i>Fully attended</span><span><i style="background:var(--yellow)"></i>Partial / missed</span><span><i style="background:var(--muted);border-radius:50%"></i>Unmarked</span>${goal ? `<span><i style="background:#facc15"></i>${goalReached() ? 'Goal reached' : 'Goal day'} (${state.settings.target || 75}%)</span>` : ''}</div>`;
  return html;
}

function daySheet(key){
  const [y, mo, dd] = key.split('-').map(Number), d = new Date(y, mo - 1, dd);
  const hol = isHoliday(d), future = key > dateKey(), out = !inSem(d);
  const list = hol || out ? [] : blocksOn(d), recs = state.records[key] || {};
  const sh = openSheet(`<h3>${d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</h3>
    <div class="hint">${key === goalDate() ? (goalReached() ? `🏆 Goal reached: you're at or above ${state.settings.target || 75}%` : `🏆 Goal day: attend every class until here to reach ${state.settings.target || 75}%`) : ''}${key === goalDate() ? '<br>' : ''}${out ? 'Outside semester' : hol ? 'Holiday' : !list.length ? 'No classes' : future ? 'Upcoming' : 'Tap to set attendance'}</div>
    <button class="trow" id="f-hol"><span class="k">🎉</span><span class="grow"><span class="name">Holiday</span></span><span class="sw ${hol?'on':''}"></span></button>
    ${list.map(sl => {
      const s = subj(sl.subjectId), n = sl.ids.length, vals = sl.ids.map(id => recs[id]);
      const all = v => vals.every(x => x === v);
      return `<div class="drow" style="--c:${s.color};min-height:${n * 58}px"><span class="e">${esc(s.emoji)}</span>
        <span class="grow"${sl.extra ? ` data-edit-extra="${sl.id}" style="cursor:pointer"` : ''}><span class="name" style="display:block">${esc(s.name)}${sl.extra ? ' <span class="xtag">Extra ✎</span>' : ''}</span><span class="time" style="display:block">${rng(sl)}</span></span>
        ${future ? '' : `<button class="mini p ${all('present')?'on':''}" data-ids="${sl.ids.join(',')}" data-v="present">✓</button><button class="mini b ${all('missed')?'on':''}" data-ids="${sl.ids.join(',')}" data-v="missed">✕</button>`}</div>`; }).join('')}
    ${out ? '' : hol ? '<div class="note">Turn Holiday off to add classes on this day.</div>' : '<button class="trow" data-add-extra style="margin-top:6px"><span class="k">＋</span><span class="grow"><span class="name">Add extra class</span></span></button>'}`);
  sh.querySelector('#f-hol').onclick = () => {
    const want = !hol;
    if (want === defaultHoliday(d)) delete state.holidays[key]; else state.holidays[key] = want;
    save(); render(); daySheet(key);
  };
  sh.addEventListener('click', e => {
    if (e.target.closest('[data-add-extra]')) return extraSheet(key);
    const ex = e.target.closest('[data-edit-extra]'); if (ex) return extraSheet(key, ex.dataset.editExtra);
    const b = e.target.closest('[data-v]'); if (!b) return;
    const r = state.records[key] || (state.records[key] = {});
    const ids = b.dataset.ids.split(','), v = b.dataset.v, clear = ids.every(id => r[id] === v);
    const bf = state.backfill[key] || (state.backfill[key] = {});
    ids.forEach(id => {
      if (clear) delete r[id]; else r[id] = v;
      if (r[id] && key < dateKey()) bf[id] = true; else delete bf[id];
    });
    if (!Object.keys(bf).length) delete state.backfill[key];
    save(); render(); daySheet(key);
  });
}

function extraSheet(key, id){
  if (!state.subjects.length){ toast('Add a subject first'); return; }
  const list = state.extras[key] || [], ex = id ? list.find(e => e.id === id) : null;
  const [y, mo, dd] = key.split('-').map(Number), d = new Date(y, mo - 1, dd);
  const sh = openSheet(`<h3>${ex ? 'Edit extra class' : 'Extra class'}</h3><div class="hint">${d.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})} · counts as one class</div>
    <label class="l">Subject</label>
    <select class="in" id="f-subj">${state.subjects.map(s => `<option value="${s.id}" ${ex && ex.subjectId === s.id ? 'selected' : ''}>${esc(s.emoji)}  ${esc(s.name)}</option>`).join('')}</select>
    <div class="two"><div><label class="l">Start (optional)</label><input class="in" type="time" id="f-start" value="${ex ? ex.start || '' : ''}"></div>
    <div><label class="l">End (optional)</label><input class="in" type="time" id="f-end" value="${ex ? ex.end || '' : ''}"></div></div>
    ${ex ? '' : '<div class="note">Add several for a day by repeating this. Tip: you can add the same subject more than once.</div>'}
    <div class="foot">${ex ? '<button class="btn del" id="f-del">Delete</button>' : '<button class="btn" id="f-cancel">Cancel</button>'}<button class="btn save" id="f-save">Save</button></div>`);
  const back = () => { render(); daySheet(key); };
  const c = sh.querySelector('#f-cancel'); if (c) c.onclick = () => daySheet(key);
  sh.querySelector('#f-save').onclick = () => {
    const subjectId = sh.querySelector('#f-subj').value, start = sh.querySelector('#f-start').value, end = sh.querySelector('#f-end').value;
    if ((start || end) && (!start || !end || toMin(end) <= toMin(start))){ toast('Set both times, end after start'); return; }
    if (ex){ Object.assign(ex, { subjectId, start, end }); }
    else (state.extras[key] || (state.extras[key] = [])).push({ id: uid(), subjectId, start, end });
    save(); back();
  };
  const dl = sh.querySelector('#f-del');
  if (dl) armDelete(dl, () => {
    state.extras[key] = list.filter(e => e.id !== id);
    if (!state.extras[key].length) delete state.extras[key];
    if (state.records[key]) delete state.records[key][id];
    if (state.backfill[key]) delete state.backfill[key][id];
    save(); back();
  });
}

function calSettingsSheet(){
  const st = state.settings;
  const SETS = { none: [], odd: [1,3,5], even: [2,4], all: [1,2,3,4,5] };
  if (!st.satMode){
    const k = Object.keys(SETS).find(k => SETS[k].join() === [...st.satOff].sort().join());
    st.satMode = k || 'custom';
  }
  const MODES = [['none','None'],['odd','Odd'],['even','Even'],['all','All'],['custom','Custom']];
  const sh = openSheet(`<h3>Calendar settings</h3><div class="hint">Semester dates and weekly holidays. Sundays are always off.</div>
    <label class="l">Semester starts</label><div class="drange"><input type="date" class="in" id="f-ss" value="${st.semStart}"><button class="btn" id="f-ss-x">✕</button></div>

/* ---------- stats ---------- */
const r1 = n => Math.round(n * 10) / 10;
function margin(p, t, target){
  const tf = target / 100;
  if (!t) return null;
  if (p / t >= tf - 1e-9) return { met: true, n: tf >= 1 ? 0 : Math.max(0, Math.floor(p / tf - t + 1e-9)) };
  return { met: false, n: tf >= 1 ? 0 : Math.ceil((tf * t - p) / (1 - tf) - 1e-9) };
}
function computeStats(){
  const per = {}, tk = dateKey();
  let attended = 0, firstKey = null;
  for (const [key, r] of Object.entries(state.records)){
    const [y, mo, dd] = key.split('-').map(Number), dt = new Date(y, mo - 1, dd);
    if (isHoliday(dt) || !inSem(dt)) continue;
    const bf = state.backfill[key] || {};
    for (const b of blocksOn(dt)){
      const v = blockVal(r, b); if (!v) continue;
      if (!firstKey || key < firstKey) firstKey = key;
      if (bf[b.id]) continue;
      const o = per[b.subjectId] || (per[b.subjectId] = { p: 0, m: 0 });
      if (v === 'present'){ o.p++; attended++; } else if (v === 'missed') o.m++;
    }
  }
  state.subjects.forEach(sb => { const a = state.settings.subjAdj[sb.id];
    if (a && (a.p || a.m)){ const o = per[sb.id] || (per[sb.id] = { p: 0, m: 0 }); o.p += a.p || 0; o.m += a.m || 0; } });
  let points = attended * 10, streak = 0, best = 0;
  if (firstKey){
    const [y, mo, dd] = firstKey.split('-').map(Number);
    for (let d = new Date(y, mo - 1, dd), i = 0; dateKey(d) <= tk && i < 1000; d.setDate(d.getDate() + 1), i++){
      if (isHoliday(d) || !inSem(d) || !blocksOn(d).length) continue;
      const st = dayStatus(d), key = dateKey(d);
      if (st === 'full'){ streak++; best = Math.max(best, streak); points += 20; if (streak % 5 === 0) points += 50; }
      else if (key !== tk) streak = 0;
      else if (Object.values(state.records[key] || {}).includes('missed')) streak = 0;
    }
  }
  return { per, attended, points, streak, best, lvl: Math.floor(Math.sqrt(points / 50)) + 1 };
}

function extraStats(){
  const wk = {}, wd = {};
  for (let i = 0; i < 7; i++) wd[i] = { p: 0, m: 0 };
  for (const [key, r] of Object.entries(state.records)){
    const [y, mo, dd] = key.split('-').map(Number), d = new Date(y, mo - 1, dd);
    if (isHoliday(d) || !inSem(d)) continue;
    const wkey = dateKey(new Date(y, mo - 1, dd - ((d.getDay() + 6) % 7)));
    for (const b of blocksOn(d)){
      const v = blockVal(r, b); if (v !== 'present' && v !== 'missed') continue;
      const w = wk[wkey] || (wk[wkey] = { p: 0, m: 0 }), x = wd[d.getDay()];
      if (v === 'present'){ w.p++; x.p++; } else { w.m++; x.m++; }
    }
  }
  const weeks = [], now = new Date();
  const thisMon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - ((now.getDay() + 6) % 7));
  for (let i = 7; i >= 0; i--){
    const m = new Date(thisMon.getFullYear(), thisMon.getMonth(), thisMon.getDate() - 7 * i), w = wk[dateKey(m)];
    weeks.push({ label: m.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }), pct: w && w.p + w.m ? w.p / (w.p + w.m) * 100 : null });
  }
  return { weeks, wd };
}

function trendSvg(weeks, target){
  const W = 320, H = 132, L = 10, R = 10, T = 10, B = 26, iw = W - L - R, ih = H - T - B;
  const xs = i => L + iw * i / (weeks.length - 1), ys = v => T + ih * (1 - v / 100);
  let path = '', dots = '';
  weeks.forEach((w, i) => {
    if (w.pct == null) return;
    path += `${weeks[i-1] && weeks[i-1].pct != null ? 'L' : 'M'}${xs(i).toFixed(1)},${ys(w.pct).toFixed(1)}`;
    dots += `<circle cx="${xs(i).toFixed(1)}" cy="${ys(w.pct).toFixed(1)}" r="3.5" style="fill:var(--accent)"/>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Weekly attendance trend">
    <line x1="${L}" x2="${W-R}" y1="${ys(target)}" y2="${ys(target)}" style="stroke:var(--muted)" stroke-dasharray="4 4" stroke-width="1"/>
    <text x="${W-R}" y="${ys(target)-4}" text-anchor="end" font-size="9" style="fill:var(--muted)">target ${target}%</text>
    <path d="${path}" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--accent)"/>${dots}
    ${weeks.map((w, i) => `<text x="${xs(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="9" style="fill:var(--muted)">${w.label}</text>`).join('')}</svg>`;
}

function subjectRows(S, target){
  return state.subjects.map(sb => ({ sb, o: S.per[sb.id] })).filter(x => x.o && x.o.p + x.o.m > 0)
    .map(x => ({ ...x, t: x.o.p + x.o.m, pc: x.o.p / (x.o.p + x.o.m) * 100 })).sort((a, b) => a.pc - b.pc);
}

    ${ui.ovOpen ? `<div class="steppers"><div class="k" style="margin-bottom:4px">Current attendance (updates as you mark classes)</div>${numrow('adjP','Classes attended',P)}${numrow('adjM','Classes missed',T - P)}

  html += `<h2>Weekly trend</h2><div class="panel">${trendSvg(X.weeks, target)}</div>`;

  const FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const withData = wdRows.filter(r => r.t > 0).sort((a, c) => c.pc - a.pc || DAY_ORDER.indexOf(a.d) - DAY_ORDER.indexOf(c.d));

    : 'No pattern yet. Mark a few classes first.';
  html += `<h2>Weekday pattern</h2><div class="panel"><div class="tg" style="font-size:16px;margin-bottom:12px">${head}</div><div class="wdbars">` +
    wdRows.map(r => `<div class="wdc"><div class="wdb"><i style="height:${r.pc == null ? 0 : Math.max(4, r.pc)}%;background:${worst && r.d === worst.d ? 'var(--red)' : bestD && r.d === bestD.d ? 'var(--green)' : 'var(--accent)'}"></i></div>${DAYS[r.d]}</div>`).join('') + `</div></div>`;

function placeholder(tab){

function status(slot, rec){
  if (rec === 'present') return 'present';
  if (rec === 'missed') return 'missed';
  if (!slot.start) return 'unmarked';
  const now = new Date(), mins = now.getHours()*60 + now.getMinutes();
  if (mins >= toMin(slot.start) && mins < toMin(slot.end)) return 'live';
  if (mins < toMin(slot.start)) return 'upcoming';
  return 'unmarked';
}
const LABEL = { present:'Attended', missed:'Missed', live:'In progress', upcoming:'Upcoming', unmarked:'Not marked' };

function rawCounts(){
  let p = 0, m = 0;
  for (const [key, r] of Object.entries(state.records)){
    const [y, mo, dd] = key.split('-').map(Number), d = new Date(y, mo - 1, dd);
    if (isHoliday(d) || !inSem(d)) continue;
    const bf = state.backfill[key] || {};
    for (const b of blocksOn(d)){ if (bf[b.id]) continue; const v = blockVal(r, b); if (v === 'present') p++; else if (v === 'missed') m++; }
  }
  return { p, m };
}
function overall(){
  const r = rawCounts(), st = state.settings;
  const p = Math.max(0, r.p + st.adjP), m = Math.max(0, r.m + st.adjM);
  return { p, t: p + m };
}
function adjMargin(p, t, target){
  const mg = margin(p, t, target) || { met: true, n: 0 };
  const buffer = mg.met ? mg.n : -mg.n;
  return { buffer, n: Math.abs(buffer) };
}

function targetInfo(){
  const { p, t } = overall(), target = state.settings.target || 75;
  if (!t) return { target, disp: '–', ring: 0, met: false, line: 'Mark your classes to start tracking' };
  const pct = p / t * 100, met = pct >= target - 1e-9;
  const disp = (Math.round(pct * 10) / 10) + '%';
  const am = adjMargin(p, t, target), gap = Math.max(0.1, Math.round((target - pct) * 10) / 10);
  const cl = n => `${n} class${n === 1 ? '' : 'es'}`;
  let line;
  if (am.buffer >= 0) line = am.n > 0 ? `${met ? 'On track · ' : ''}you can miss ${am.n} more ${am.n === 1 ? 'class' : 'classes'}` : (met ? 'On track · keep attending' : `${gap}% to go`);
  else line = `${met ? '' : gap + '% to go · '}attend the next ${cl(am.n)}`;
  return { target, disp, ring: Math.min(1, pct / target), met, line };
}

function focusCard(slotId){
  const key = dateKey(), sl = blocksOn(new Date()).find(x => x.id === slotId);
  if (!sl) return;
  const s = subj(sl.subjectId), st = status(sl, blockVal(state.records[key] || {}, sl));
  const root = document.createElement('div');
  root.className = 'focus';
  root.innerHTML = `<div class="fup" id="h-up">↑ Back</div>
    <div class="fl" id="h-l">✕<br>Missed</div><div class="fr" id="h-r">✓<br>Attended</div>
    <div class="fcard" id="fc" style="--c:${s.color}"><span class="badge ${st}">${LABEL[st]}</span>
      <div class="tc-emoji">${esc(s.emoji)}</div><div class="tc-name">${esc(s.name)}</div>
      <div class="tc-time">${rng(sl)}</div></div>
    <div class="fbtns"><button class="rb m" id="b-m" aria-label="Missed">✕</button><button class="rb a" id="b-a" aria-label="Attended">✓</button></div>
    <div class="fcap">Swipe right to attend · left to miss · up to go back</div>`;
  document.body.appendChild(root);
  const fc = root.querySelector('#fc'), hl = root.querySelector('#h-l'), hr2 = root.querySelector('#h-r'), hu = root.querySelector('#h-up');
  let sx = 0, sy = 0, dx = 0, dy = 0, drag = false, busy = false;
  const onKey = e => {
    if (e.key === 'ArrowRight') commit('present'); else if (e.key === 'ArrowLeft') commit('missed');
    else if (e.key === 'ArrowUp' || e.key === 'Escape') leave();
  };
  document.addEventListener('keydown', onKey);
  const close = () => { document.removeEventListener('keydown', onKey); root.remove(); };
  const leave = () => {
    if (busy) return; busy = true;
    fc.style.transition = 'transform .25s ease, opacity .25s'; fc.style.transform = `translateY(-${innerHeight}px)`; fc.style.opacity = 0;
    setTimeout(close, 220);
  };
  const commit = v => {
    if (busy) return; busy = true;
    const dir = v === 'present' ? 1 : -1;
    fc.style.transition = 'transform .25s ease, opacity .25s';
    fc.style.transform = `translate(${dir * innerWidth}px, ${dy}px) rotate(${dir * 30}deg)`; fc.style.opacity = 0;
    setTimeout(() => {
      const r = state.records[key] || (state.records[key] = {});
      sl.ids.forEach(id => { r[id] = v; if (state.backfill[key]) delete state.backfill[key][id]; });
      save(); close(); render();
      toast(v === 'present' ? 'Marked attended' : 'Marked missed');
    }, 230);
  };
  const reset = () => {
    fc.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)'; fc.style.transform = '';
    fc.classList.remove('go-r', 'go-l'); hl.style.opacity = hr2.style.opacity = 0; hu.style.opacity = .5;
  };
  fc.addEventListener('pointerdown', e => {
    if (busy) return; drag = true; sx = e.clientX; sy = e.clientY; dx = dy = 0;
    fc.setPointerCapture(e.pointerId); fc.style.transition = 'none';
  });
  fc.addEventListener('pointermove', e => {
    if (!drag) return;
    dx = e.clientX - sx; dy = e.clientY - sy; if (dy > 0) dy *= 0.2;
    fc.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx / 18}deg)`;
    const horiz = Math.abs(dx) >= Math.abs(dy);
    hr2.style.opacity = horiz && dx > 0 ? Math.min(1, dx / 100) : 0;
    hl.style.opacity = horiz && dx < 0 ? Math.min(1, -dx / 100) : 0;
    hu.style.opacity = !horiz && dy < 0 ? Math.min(1, .5 + -dy / 100) : .5;
    fc.classList.toggle('go-r', horiz && dx > 40); fc.classList.toggle('go-l', horiz && dx < -40);
  });
  const end = () => {
    if (!drag) return; drag = false;
    if (dx > 100) commit('present'); else if (dx < -100) commit('missed');
    else if (dy < -100 && -dy > Math.abs(dx)) leave(); else reset();
  };
  fc.addEventListener('pointerup', end); fc.addEventListener('pointercancel', end);
  root.addEventListener('pointerdown', e => { if (e.target === root) leave(); });
  root.querySelector('#b-m').onclick = () => commit('missed');
  root.querySelector('#b-a').onclick = () => commit('present');
}

/* ---------- DSATM preset ---------- */
const DSATM = [
  ['09:30','10:25','class'], ['10:25','11:20','class'], ['11:20','11:35','break'],
  ['11:35','12:30','class'], ['12:30','13:25','class'], ['13:25','14:15','break'],
  ['14:15','15:10','class'], ['15:10','16:05','class'], ['16:05','17:00','class']
];
/* add future colleges here: { id, name, periods: [[start, end, 'class'|'break'], ...] } */
const COLLEGES = [{ id: 'dsatm', name: 'DSATM', periods: DSATM }];
function applyPreset(c){
  const sig = list => list.map(p => `${p.start}-${p.end}-${p.kind === 'break' ? 'break' : 'class'}`).join('|');
  const old = sortedPeriods();
  if (sig(old) === sig(c.periods.map(([start, end, kind]) => ({ start, end, kind })))){
    toast(`${c.name} times already applied`); return false;
  }
  const next = c.periods.map(([start, end, kind]) => ({ id: uid(), start, end, kind, label: kind === 'break' ? 'Break' : '' }));
  const oldClass = old.filter(p => p.kind !== 'break'), newClass = next.filter(p => p.kind !== 'break');
  const live = state.slots.filter(s => subj(s.subjectId));
  const gone = [];
  state.slots.forEach(s => {
    const i = oldClass.findIndex(p => p.id === s.periodId);
    if (subj(s.subjectId) && i >= 0 && i < newClass.length) s.periodId = newClass[i].id; else gone.push(s.id);
  });
  const dropped = live.filter(s => gone.includes(s.id)).length;
  dropSlots(s => gone.includes(s.id));
  state.periods = next;
  save(); render();
  toast(!live.length ? `${c.name} schedule added` : dropped ? `${c.name} applied · ${dropped} class${dropped === 1 ? '' : 'es'} didn't fit and were removed` : `${c.name} applied · your classes were carried over`);
  return true;
}

/* ---------- sheets ---------- */
function openSheet(inner){
  const root = document.getElementById('sheet-root');
  root.innerHTML = `<div class="backdrop"><div class="sheet"><div class="grab"></div>${inner}</div></div>`;
  root.firstChild.addEventListener('mousedown', e => { if (e.target === root.firstChild) closeSheet(); });
  const sh = root.querySelector('.sheet');
  enableSheetDrag(sh, root.firstChild);
  return sh;
}
function enableSheetDrag(sh, bd){
  let sy = 0, dy = 0, on = false, fromHandle = false;
  const start = (y, t) => {
    if (t.closest('input[type=range]')) return;
    fromHandle = !!t.closest('.grab');
    if (!fromHandle && sh.scrollTop > 0) return;
    sy = y; dy = 0; on = true; sh.style.transition = 'none'; sh.style.animation = 'none';
  };
  const move = y => {
    dy = Math.max(0, y - sy);
    sh.style.transform = `translateY(${dy}px)`;
    bd.style.background = `rgba(0,0,0,${0.6 * (1 - Math.min(1, dy / 400))})`;
  };
  const end = () => {
    if (!on) return; on = false;
    sh.style.transition = 'transform .2s ease';
    if (dy > 110){
      sh.style.transform = 'translateY(100%)'; bd.style.transition = 'background .2s'; bd.style.background = 'rgba(0,0,0,0)';
      setTimeout(closeSheet, 190);
    } else { sh.style.transform = ''; bd.style.background = ''; }
  };
  sh.addEventListener('touchstart', e => { if (e.touches.length === 1) start(e.touches[0].clientY, e.target); }, { passive: true });
  sh.addEventListener('touchmove', e => {
    if (!on) return;
    const y = e.touches[0].clientY;
    if (y - sy <= 0 && !fromHandle){ on = false; sh.style.transform = ''; return; }
    move(y); if (e.cancelable) e.preventDefault();
  }, { passive: false });
  sh.addEventListener('touchend', end); sh.addEventListener('touchcancel', end);
  const h = sh.querySelector('.grab');
  h.addEventListener('pointerdown', e => { if (e.pointerType === 'mouse'){ start(e.clientY, e.target); h.setPointerCapture(e.pointerId); } });
  h.addEventListener('pointermove', e => { if (on && e.pointerType === 'mouse') move(e.clientY); });
  h.addEventListener('pointerup', e => { if (e.pointerType === 'mouse') end(); });
}
function closeSheet(){ document.getElementById('sheet-root').innerHTML = ''; }
function armDelete(btn, fn){
  btn.onclick = () => {
    if (!btn.classList.contains('arm')){ btn.classList.add('arm'); btn.textContent = 'Tap again'; return; }
    fn();
  };
}

  const chain = chainPeriods(ui.day, p), cur = slotAt(ui.day, periodId);
  if (!state.subjects.length){ toast('Add a subject first'); return subjectSheet(); }
  const sh = openSheet(`<h3>${DAYS[ui.day]} · ${fmt(p.start)} – ${fmt(chainEnd(ui.day, p))}</h3><div class="hint">${chain.length > 1 ? `Applies to all ${chain.length} slots in this block` : 'Pick the subject for this slot'}</div>
    <div class="picks">${state.subjects.map(s => `<button class="pick ${cur&&cur.subjectId===s.id?'sel':''}" style="--c:${s.color}" data-pick="${s.id}">
      <span class="emoji">${esc(s.emoji)}</span><span class="name">${esc(s.name)}</span>${cur&&cur.subjectId===s.id?'<span class="tick">✓</span>':''}</button>`).join('')}</div>
    ${cur?`<div class="foot"><button class="btn del" id="f-clear" style="flex:1">${chain.length > 1 ? 'Clear block' : 'Clear slot'}</button></div>`:''}`);
  sh.querySelector('.picks').onclick = e => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    const sid = b.dataset.pick;
    chain.forEach(q => {
      const c = slotAt(ui.day, q.id);
      if (c && c.subjectId === sid) return;
      if (c) dropSlots(s => s.id === c.id);
      state.slots.push({ id: uid(), day: ui.day, periodId: q.id, subjectId: sid });
    });
    save(); closeSheet(); render(); toast('Slot updated');
  };
  const cl = sh.querySelector('#f-clear');
  if (cl) cl.onclick = () => { chain.forEach(q => { const c = slotAt(ui.day, q.id); if (c) dropSlots(s => s.id === c.id); }); save(); closeSheet(); render(); toast('Slot cleared'); };
}

/* ---------- events ---------- */
document.getElementById('view').addEventListener('click', e => {
  const t = e.target;
  let el;
  if ((el = t.closest('[data-mark]'))){
    const key = dateKey(), r = state.records[key] || (state.records[key] = {});
    const id = el.dataset.id, val = el.dataset.mark;
    if (r[id] === val) delete r[id]; else r[id] = val;
    save(); render();
  } else if (t.closest('[data-holiday]')){
    const d = new Date(), key = dateKey(d), want = !isHoliday(d);
    if (want === defaultHoliday(d)) delete state.holidays[key]; else state.holidays[key] = want;
    save(); render(); toast(want ? 'Today marked as a holiday' : 'Holiday removed');
  } else if ((el = t.closest('[data-open]'))){ focusCard(el.dataset.open);
  } else if (t.closest('[data-target]')){ targetSheet();
  } else if ((el = t.closest('[data-go]'))){ ui.tab = el.dataset.go; render();
  } else if (t.closest('[data-add-subject]')){ subjectSheet();
  } else if ((el = t.closest('[data-edit-subject]'))){ subjectSheet(el.dataset.editSubject);
  } else if (t.closest('[data-times]')){ timesSheet();
  } else if ((el = t.closest('[data-day]'))){ ui.day = +el.dataset.day; render();
  } else if ((el = t.closest('[data-assign]'))){ assignSheet(el.dataset.assign);
  } else if (t.closest('[data-ov]')){ ui.ovOpen = !ui.ovOpen; render();
  } else if (t.closest('[data-subjects]')){ subjectsSheet();
  } else if ((el = t.closest('[data-wi]'))){ ui.wiN = Math.max(0, Math.min(99, ui.wiN + +el.dataset.d)); render();
  } else if ((el = t.closest('[data-adj]'))){
    const k = el.dataset.adj, raw = rawCounts();
    let v = state.settings[k] + +el.dataset.d;
    if (k === 'adjP') v = Math.max(-raw.p, v);
    if (k === 'adjM') v = Math.max(-raw.m, v);
    state.settings[k] = v; save(); render();
  } else if ((el = t.closest('[data-cal-nav]'))){
    const d = new Date(ui.cal.y, ui.cal.m + +el.dataset.calNav, 1); ui.cal = { y: d.getFullYear(), m: d.getMonth() }; render();
  } else if ((el = t.closest('[data-cal-day]'))){ daySheet(el.dataset.calDay);
  } else if (t.closest('[data-cal-settings]')){ calSettingsSheet();
  }
});

document.getElementById('view').addEventListener('change', e => {
  const i = e.target.closest('[data-set]'); if (!i) return;
  const k = i.dataset.set, raw = rawCounts();
  const typed = Math.max(0, Math.floor(+i.value || 0));
  state.settings[k] = typed - (k === 'adjP' ? raw.p : raw.m);
  save(); render();
});

try {
  const cap = window.Capacitor;
  if (cap && cap.isNativePlatform && cap.isNativePlatform() && cap.Plugins && cap.Plugins.App){
    cap.Plugins.App.addListener('backButton', () => {
      if (document.querySelector('.focus')){ document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' })); return; }
      if (document.querySelector('.backdrop')){ closeSheet(); return; }
      if (ui.tab !== 'home'){ ui.tab = 'home'; render(); window.scrollTo(0, 0); return; }
      cap.Plugins.App.exitApp();
    });
  }
} catch(e){}

render();
setInterval(() => { if (ui.tab === 'home' && !document.querySelector('.backdrop') && !document.querySelector('.focus')) render(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && ui.tab === 'home') render(); });
})();
</script>
</body>
</html>
